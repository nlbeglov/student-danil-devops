services:
  server:
    image: docker.gitea.com/gitea:1.27.3
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${POSTGRES_DB}
      - GITEA__database__USER=${POSTGRES_USER}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__server__DOMAIN=${DOMAIN}
      - GITEA__server__ROOT_URL=https://${DOMAIN}/
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__DEFAULT__APP_NAME=Diagnostics Lab
    volumes:
      - ../data/gitea:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  caddy:
    # Собственный Caddy задания работает по HTTP внутри сети: сбой proxy ломает его upstream.
    # HTTPS, порты 80/443 и сертификаты обслуживает общий Caddy (common/caddy), он ходит сюда через сеть edge.
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      - server
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
      edge:
        aliases:
          - task05-caddy

networks:
  edge:
    external: true
    name: edge
