name: CI/CD

# срабатывает при каждом push в ветку main
on:
  push:
    branches: [main]

# concurrency не даёт запуститься двум доставкам одновременно
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # JOB 1: тесты. Если этот job упадёт - build и deploy не запустятся.
  test:
    runs-on: ubuntu-latest
    steps:
      # checkout - скачивает код репозитория в рабочую директорию раннера
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install dependencies
        run: pip install -r configs/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  # JOB 2: сборка образа и публикация в GHCR.
  # needs: test запустится ТОЛЬКО если job test завершился успешно
  build:
    needs: test
    runs-on: ubuntu-latest
    # permissions:packages:write - разрешение публиковать образы в GHCR
    # с помощью встроенного токена GITHUB_TOKEN (не нужен отдельный PAT)
    permissions:
      contents: read
      packages: write
    # outputs пробрасывает значения из шагов этого job в другие jobs -
    # так job deploy узнает точный digest только что собранного образа
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.image_ref.outputs.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # github.actor - логин того, кто запустил workflow (обычно ты)
          username: ${{ github.actor }}
          # GITHUB_TOKEN создаётся автоматически на каждый запуск,
          # действует только во время выполнения workflow
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: configs/Dockerfile
          push: true
          # тегируем образ SHA коммита - так по тегу сразу видно,
          # из какого именно коммита он собран (требование задания:
          # "связать его с commit исходного кода")
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          # метки OCI: образ можно связать с исходным коммитом, не запуская его
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Compose full image reference with digest
        id: image_ref
        # steps.push.outputs.digest - это то самое значение sha256:...,
        # которое вернул шаг сборки. Собираем из него полную ссылку
        # вида ghcr.io/owner/repo@sha256:... - именно её мы будем
        # разворачивать на сервере (не по тегу, а по digest!)
        run: |
          echo "ref=ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Print image reference (для evidence/логов)
        run: |
          echo "Собран и опубликован образ:"
          echo "  commit:  ${{ github.sha }}"
          echo "  digest:  ${{ steps.push.outputs.digest }}"
          echo "  ref:     ${{ steps.image_ref.outputs.ref }}"
          # то же в сводку прогона: готовая строка для таблицы "версия - commit - digest" в RESULT.md
          {
            echo "### Выпуск"
            echo "| Версия | Commit | Digest |"
            echo "|---|---|---|"
            echo "| ${{ github.sha }} | ${{ github.sha }} | ${{ steps.push.outputs.digest }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # JOB 3: доставка на VPS (полный разбор в README.md этого задания).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # environment создаёт отдельную "среду" в GitHub с историей деплоев
    # и возможностью настроить обязательное подтверждение перед деплоем
    # (можно включить вручную в настройках репозитория для доп. контроля)
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          APP_VERSION: ${{ github.sha }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: bash scripts/ci-deploy.sh

      - name: Verify deployment
        env:
          # домен зафиксирован (тот же, что в Caddyfile) - вынесен
          # в переменную только для читаемости, не для гибкости
          APP_DOMAIN: a2.fdghyt.com
          # ожидаемая версия = commit, из которого собран развёрнутый образ
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          # ждём, пока Caddy и приложение поднимутся после перезапуска (до 2 минут),
          # вместо фиксированной паузы
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 "https://${APP_DOMAIN}/health" > /dev/null; then
              break
            fi
            echo "Сервис ещё не отвечает ($i/12), ждём 10 с..."
            sleep 10
          done

          echo "Проверка /health:"
          curl -sf --max-time 10 "https://${APP_DOMAIN}/health"
          echo ""

          echo "Проверка /version (ожидается: ${EXPECTED_VERSION}):"
          ACTUAL_VERSION=$(curl -sf --max-time 10 "https://${APP_DOMAIN}/version" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["version"])')
          echo "Получено: ${ACTUAL_VERSION}"
          if [ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "ОШИБКА: на VPS работает не та версия" >&2
            exit 1
          fi

          echo "Проверка сложения (2+3):"
          RESULT=$(curl -sf --max-time 10 "https://${APP_DOMAIN}/add?a=2&b=3" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["result"])')
          echo "Получено: ${RESULT}"
          if [ "${RESULT}" != "5" ]; then
            echo "ОШИБКА: сложение работает неверно" >&2
            exit 1
          fi
