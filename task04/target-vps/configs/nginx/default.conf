server {
    listen 80;
    server_name _;

    # Состояние /health определяет включаемый файл: 200 или 503.
    # Файл подменяет scripts/set-health.sh, затем выполняется `nginx -s reload`.
    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/health/state.inc;
    }

    location / {
        default_type text/plain;
        return 200 "task04 target\n";
    }
}