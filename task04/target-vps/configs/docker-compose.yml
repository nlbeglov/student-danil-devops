services:
  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../data/health:/etc/nginx/health:ro

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "80:80"
      # HTTPS-порт хоста совпадает с портом внутри контейнера (редиректы и сертификаты используют именно его)
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    environment:
      - TARGET_DOMAIN=${TARGET_DOMAIN}
      - HTTPS_PORT=${HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: